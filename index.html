<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carlos Alexandre</title>
  <meta name="description" content="Carlos Alexandre · Estudante de ADS · IA & Automação · Cloud Engineer in the making"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #0f0f1a;
      --surface2: #141425;
      --border: #1e1e3a;
      --accent: #00ff88;
      --accent2: #0088ff;
      --accent3: #7c3aed;
      --text: #e2e8f0;
      --muted: #64748b;
      --glow2: 0 0 20px rgba(0, 136, 255, 0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,136,255,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Terminal bar ---------- */
    .terminal-bar {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px 10px 0 0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: -1px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-r { background: #ff5f57; }
    .dot-y { background: #ffbd2e; }
    .dot-g { background: #28c840; }
    .terminal-title {
      font-size: 11px;
      color: var(--muted);
      margin-left: 8px;
      letter-spacing: 0.05em;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0 0 16px 16px;
      padding: 32px 24px 28px;
    }

    /* ---------- Perfil ---------- */
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }
    .avatar-wrapper { position: relative; width: 90px; height: 90px; }
    .avatar-ring {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(var(--accent), var(--accent2), var(--accent3), var(--accent));
      animation: spin 4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .avatar-inner {
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: var(--bg);
      overflow: hidden;
    }
    .avatar-inner img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .profile-info { text-align: center; }
    .name {
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      display: flex;
      justify-content: center;
    }
    .typewriter {
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid var(--accent);
      width: 0;
